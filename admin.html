<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>10 BUNZ | لوحة التحكم</title>
<meta name="theme-color" content="#2c318b">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="manifest" href="admin-manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#2c318b;--blue:#3b42c4;--yellow:#ffd23f;--bg:#f4f6fb;--line:#e3e7f2;--muted:#5b6585;--red:#e5484d;--green:#1f9d55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Cairo,system-ui,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
header b{font-size:18px;font-weight:900;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:40}
.tabs button{flex:none;border:0;background:var(--bg);padding:8px 14px;border-radius:99px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 6px #2c318b0b}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:12px 14px}.stat small{color:var(--muted);font-weight:700}.stat div{font-size:22px;font-weight:900}
input.i,select.i,textarea.i{border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff;color:var(--navy);width:100%}
label{font-weight:800;font-size:13px;display:block;margin:10px 0 4px}
.btn{border:0;border-radius:11px;padding:9px 16px;font-weight:800;background:var(--navy);color:#fff}
.btn.s{background:var(--bg);color:var(--navy)}.btn.y{background:var(--yellow);color:var(--navy)}.btn.r{background:#fdecec;color:var(--red)}.btn.g{background:#25d366}
.order{border-right:5px solid var(--line)}
.order.new{border-color:var(--yellow);animation:fl 1.5s 3}
@keyframes fl{50%{background:#fff8dc}}
.order.preparing{border-color:var(--blue)}.order.on_the_way{border-color:#8b5cf6}.order.done{border-color:var(--green);opacity:.75}.order.cancelled{border-color:var(--red);opacity:.5}
.order h3{margin:0;font-size:18px}
.order .meta{color:var(--muted);font-size:13px}
.order ul{margin:8px 0;padding-right:18px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--bg)}
.st button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px}
.st button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.item img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.tg{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
#login{max-width:340px;margin:12vh auto;text-align:center}
#map{height:260px;border-radius:12px;margin-top:10px}
.qr{display:flex;gap:14px;align-items:center}
.qr canvas{width:120px;height:120px;border-radius:8px;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:800;display:none;z-index:99}
h2{font-size:18px;margin:6px 0 12px}
.ono{display:inline-block;background:var(--navy);color:#fff;border-radius:10px;padding:0 10px;margin-left:6px;font-weight:900}
.order.ready{border-color:var(--green)}
.hb{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.hb{grid-template-columns:1fr}}
.col h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between}
.tile{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px #2c318b14;border-right:6px solid var(--line)}
.tile.ready{border-color:var(--green);background:#f3fcf6}.tile.on_the_way{border-color:#8b5cf6}.tile.preparing{border-color:var(--blue)}.tile.new{border-color:var(--yellow)}
.tile .big{font-size:40px;font-weight:900;line-height:1;color:var(--navy)}
.tile .btn{width:100%;margin-top:8px;padding:11px}
.scanbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.scanbar .btn{font-size:17px;padding:14px 20px}
.modal{position:fixed;inset:0;background:#1d2166cc;z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:22px;max-width:440px;width:100%;padding:18px;text-align:center;max-height:94vh;overflow:auto}
.modal video{width:100%;border-radius:14px;background:#000;aspect-ratio:1/1;object-fit:cover}
.modal .huge{font-size:64px;font-weight:900;color:var(--navy);line-height:1.1}
.alertbar{display:none;background:var(--red);color:#fff;padding:12px 16px;font-weight:900;font-size:17px;align-items:center;gap:10px;justify-content:space-between;position:sticky;top:104px;z-index:39;animation:pulse 1s infinite alternate}
.alertbar button{background:#fff;color:var(--red);border:0;border-radius:99px;padding:8px 14px;font-weight:900;font-family:inherit}
@keyframes pulse{from{opacity:1}to{opacity:.8}}
.age{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:900;font-size:14px;background:#e8f7ee;color:#1f9d55}
.age.warn{background:#fff6d6;color:#a16207}.age.late{background:var(--red);color:#fff}
.qpos{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:900;margin-left:6px}
.tile.islate{box-shadow:0 0 0 3px var(--red)}
.enable{background:#fff6d6;border:2px dashed var(--yellow);border-radius:16px;padding:12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:800;color:var(--blue);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div id="login" class="card">
  <h2>لوحة تحكم 10 BUNZ</h2>
  <input class="i" id="pin" type="password" inputmode="numeric" placeholder="الرمز السري" style="text-align:center;font-size:20px">
  <button class="btn" style="width:100%;margin-top:12px" id="loginBtn">دخول</button>
  <div class="muted" id="loginErr" style="color:var(--red);margin-top:8px"></div>
</div>
<div id="app" style="display:none">
  <header><b>10 BUNZ · لوحة التحكم</b><span id="openState" class="pill"></span><a href="./" target="_blank" style="color:#fff;font-size:13px">الموقع ↗</a></header>
  <nav class="tabs" id="tabs">
    <button data-t="handover">🛵 التسليم</button><button data-t="orders" class="on">الطلبات</button><button data-t="menu">المنيو والأسعار</button>
    <button data-t="delivery">التوصيل</button><button data-t="settings">الدوام والإعدادات</button><button data-t="qr">روابط وQR</button><button data-t="crm">👥 الزبائن والحملات</button><button data-t="calls" id="callsTab">📞 اتصلوا بيه والإشعارات</button>
  </nav>
  <div class="alertbar" id="alertBar"><span id="alertTxt"></span><button id="alertGo">افتح الطلبات</button></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script src="config.js?v=6"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let PIN = sessionStorage.getItem('bunz_pin') || '';
let D = null, ORDERS = [], TAB = 'orders', lastMaxId = +localStorage.getItem('bunz_last_seen') || 0, poll;
const ST = { new: 'جديد', preparing: 'يتحضر', ready: 'جاهز ✅', on_the_way: 'بالطريق', done: 'تم', cancelled: 'ملغي' };
function toast(t) { $('toast').textContent = t; $('toast').style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').style.display = 'none', 2200); }
async function call(fn, body) {
  const r = await bunzApi.rpc(fn, { pin: PIN, ...body });
  if (r && r.error === 'bad_pin') { logout('الرمز غلط أو انقفل الدخول 15 دقيقة'); throw new Error('bad_pin'); }
  if (r && r.error) { toast('خطأ: ' + r.error); throw new Error(r.error); }
  return r;
}
function logout(msg) { sessionStorage.removeItem('bunz_pin'); PIN = ''; $('app').style.display = 'none'; $('login').style.display = 'block'; $('loginErr').textContent = msg || ''; clearInterval(poll); }
$('loginBtn').onclick = async () => { PIN = $('pin').value.trim(); try { await refresh(); sessionStorage.setItem('bunz_pin', PIN); start(); } catch (e) { } };
$('pin').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
async function refresh() { D = await call('bunz_admin_data'); $('openState').textContent = D.settings.is_open ? '● مفتوح' : '● مغلق'; $('openState').style.color = D.settings.is_open ? '#1f9d55' : '#e5484d'; }
async function start() {
  $('login').style.display = 'none'; $('app').style.display = 'block';
  await loadOrders(true); await loadCalls(true); render(); keepAwake(); staffState();
  poll = setInterval(async () => { await loadOrders(); await loadCalls(); if (TAB === 'orders' || TAB === 'handover') render(); }, 15000);
}
$('alertGo').onclick = () => $('tabs').querySelector('[data-t="handover"]').click();
$('tabs').onclick = async e => { const t = e.target.dataset.t; if (!t) return; TAB = t; $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); await refresh(); if (t === 'calls') await loadCalls(true); if (t === 'crm') CUS = null; render(); };

let AC = null;
function tone(freqs, step, vol) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); freqs.forEach((f, i) => { const t = AC.currentTime + i * step, o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + step * .9); o.start(t); o.stop(t + step); }); } catch {} }
function beep() { tone([880, 880, 880], .25, .3); }
function alarm() { tone([988, 784, 988, 784, 988, 784], .22, .5); if (navigator.vibrate) navigator.vibrate([300, 150, 300]); }
document.addEventListener('click', () => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch {} }, { once: true });

// ---------- timing: nothing gets late ----------
const AL = () => ({ accept: (D && D.settings.alert_accept_min) || 3, ready: (D && D.settings.alert_ready_min) || 20, pickup: (D && D.settings.alert_pickup_min) || 10 });
const mins = d => Math.max(0, Math.floor((Date.now() - new Date(d)) / 6e4));
const readyAt = o => (o.status_at && o.status_at.ready) || o.created_at;
function lateness(o) {
  const a = AL(), t = mins(o.created_at);
  if (o.status === 'new') return t >= a.accept ? 'late' : t >= a.accept - 1 ? 'warn' : '';
  if (o.status === 'preparing') return t >= a.ready ? 'late' : t >= a.ready * .75 ? 'warn' : '';
  if (o.status === 'ready' && o.order_type === 'delivery') return mins(readyAt(o)) >= a.pickup ? 'late' : '';
  return '';
}
function ageChip(o) {
  if (['done', 'cancelled'].includes(o.status)) return '';
  const t = mins(o.created_at), lv = lateness(o);
  return `<span class="age ${lv}" data-age="${o.id}">⏱ ${t} د${lv === 'late' ? ' · متأخر' : ''}</span>`;
}
const byOldest = (a, b) => new Date(a.created_at) - new Date(b.created_at);
function updateAlerts() {
  const fresh = ORDERS.filter(o => o.status === 'new'), late = ORDERS.filter(o => !['done', 'cancelled'].includes(o.status) && lateness(o) === 'late');
  const bar = $('alertBar');
  if (fresh.length) { $('alertTxt').textContent = '🔔 ' + (fresh.length === 1 ? 'طلب جديد #' + fresh[0].order_no + ' ينتظر القبول' : fresh.length + ' طلبات جديدة تنتظر القبول'); bar.style.display = 'flex'; }
  else if (late.length) { $('alertTxt').textContent = '⏰ ' + late.length + ' طلب متأخر: ' + late.map(o => '#' + o.order_no).join('، '); bar.style.display = 'flex'; }
  else bar.style.display = 'none';
  document.title = fresh.length ? '(' + fresh.length + ') 🔔 طلب جديد' : late.length ? '⏰ طلب متأخر' : '10 BUNZ | لوحة التحكم';
  return { fresh, late };
}
let ringT = 0;
function tick() {
  document.querySelectorAll('[data-age]').forEach(el => { const o = ORDERS.find(x => x.id == el.dataset.age); if (o) { const lv = lateness(o); el.className = 'age ' + lv; el.textContent = '⏱ ' + mins(o.created_at) + ' د' + (lv === 'late' ? ' · متأخر' : ''); } });
  const { fresh, late } = updateAlerts();
  // keep ringing every 20s while a new order is not accepted; a softer beep every 2 min for late orders
  if (fresh.length && Date.now() - ringT > 2e4) { ringT = Date.now(); alarm(); }
  else if (!fresh.length && late.length && Date.now() - ringT > 12e4) { ringT = Date.now(); beep(); }
}
setInterval(tick, 5000);
let WL = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !WL && document.visibilityState === 'visible') { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => WL = null); } } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (PIN && poll) loadOrders().then(() => { if (TAB === 'orders' || TAB === 'handover') render(); }); } });

async function loadOrders(first) {
  const r = await call('bunz_admin_orders', { lim: 150 });
  ORDERS = r.orders;
  const max = ORDERS.length ? ORDERS[0].id : 0;
  if (!first && max > lastMaxId) { ringT = Date.now(); alarm(); toast('🔔 طلب جديد #' + ORDERS[0].order_no); }
  lastMaxId = max; localStorage.setItem('bunz_last_seen', max);
  updateAlerts();
}
function render() { ({ orders, menu, delivery, settings, qr, calls, handover, crm })[TAB](); }

// ---------- customers + WhatsApp campaigns ----------
let CUS = null, CBX = [];
const daysAgo = d => Math.floor((Date.now() - new Date(d)) / 864e5);
const agoTxt = d => { const n = daysAgo(d); return n === 0 ? 'اليوم' : n === 1 ? 'أمس' : 'قبل ' + n + ' يوم'; };
const SEG = {
  all: ['الكل', c => true],
  new: ['⭐ جدد (طلب واحد)', c => c.orders == 1],
  loyal: ['💎 دائمين (3 طلبات أو أكثر)', c => c.orders >= 3],
  top: ['💰 أعلى صرف (أفضل 20%)', null],
  sleep: ['😴 ما طلبوا من 14 يوم', c => daysAgo(c.last_at) >= 14],
  week: ['🔥 طلبوا هذا الأسبوع', c => daysAgo(c.last_at) <= 7],
  calls: ['📞 طلبوا اتصال وما طلبوا', null]
};
function segList(k, q) {
  let l;
  if (k === 'calls') l = CBX.map(c => ({ phone: c.phone, name: c.name, orders: 0, spent: 0, last_at: c.at, favorites: [], last_items: [] }));
  else if (k === 'top') { const s = [...CUS].sort((a, b) => b.spent - a.spent); l = s.slice(0, Math.max(1, Math.ceil(s.length * .2))); }
  else l = CUS.filter(SEG[k][1]);
  if (q) l = l.filter(c => (c.name || '').includes(q) || c.phone.includes(q) || (c.area || '').includes(q) || JSON.stringify(c.favorites || []).includes(q));
  return l;
}
const intl = p => { p = String(p).replace(/\D/g, ''); return p.startsWith('0') ? '964' + p.slice(1) : p; };
const fill = (t, c) => t.replace(/\{الاسم\}/g, (c.name || '').split(' ')[0] || 'حبيبنا');
async function crm() {
  if (!CUS) { $('view').innerHTML = '<div class="card muted">... جاري التحميل</div>'; const r = await call('bunz_admin_customers'); CUS = r.customers; CBX = r.callbacks; }
  const seg = sessionStorage.getItem('bunz_seg') || 'all';
  const tot = CUS.reduce((a, c) => a + +c.spent, 0), rep = CUS.filter(c => c.orders > 1).length;
  $('view').innerHTML = `
    <div class="stats">
      <div class="stat"><small>عدد الزبائن</small><div>${CUS.length}</div></div>
      <div class="stat"><small>رجعوا طلبوا مرة ثانية</small><div>${CUS.length ? Math.round(rep / CUS.length * 100) : 0}%</div></div>
      <div class="stat"><small>معدل صرف الزبون</small><div>${fmtIQD(CUS.length ? tot / CUS.length : 0)}</div></div>
      <div class="stat"><small>مفعّلين الإشعارات</small><div>${CUS.filter(c => c.has_push).length}</div></div>
    </div>
    <div class="card"><div class="row"><select class="i" id="seg" style="width:auto">${Object.entries(SEG).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select>
      <input class="i" id="q" placeholder="بحث: اسم، رقم، منطقة، أيتم" style="flex:1;min-width:160px"></div>
      <div id="cl" style="margin-top:10px;overflow:auto"></div></div>
    <div class="card"><h2>📣 حملة واتساب للمجموعة المختارة</h2>
      <div class="muted">اكتب الرسالة، و<b>{الاسم}</b> يتبدل باسم كل زبون.</div>
      <textarea class="i" id="cm" rows="4" style="margin-top:8px">هلا {الاسم} 👋
عرض الليلة من 10 BUNZ 🔥
اطلب من هنا: ${esc(siteBase())}</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn g" id="seq">▶️ إرسال واحد بعد الثاني</button>
        <button class="btn s" id="vcf">📇 تنزيل الأرقام (لقائمة البث)</button>
        <button class="btn s" id="csv">📊 تنزيل Excel</button>
      </div>
      <details><summary>شنو الفرق بين الطرق؟</summary><div class="muted" style="line-height:1.9;margin-top:6px">
        <b>إرسال واحد بعد الثاني:</b> مجاني. يفتح واتساب لكل زبون والرسالة جاهزة باسمه، تضغط إرسال وترجع تضغط "التالي". مناسب لحد ~50 زبون.<br>
        <b>قائمة البث (Broadcast):</b> مجاني. نزّل ملف الأرقام وافتحه بالموبايل حتى تنحفظ، وبعدها بواتساب بزنس: القائمة ← قائمة بث جديدة ← اختار الزبائن (لحد 256). الرسالة توصل بس للي حافظين رقم المطعم.<br>
        <b>إشعار الموقع 🔔:</b> مجاني وبضغطة وحدة، من تبويب "اتصلوا بيه والإشعارات"، للي فعّلوا الإشعارات.<br>
        <b>إرسال تلقائي للكل بضغطة وحدة:</b> يحتاج WhatsApp Business API من Meta، وهو مدفوع لكل رسالة ويحتاج توثيق حساب. إذا تريده أجهزه.</div></details>
    </div>`;
  $('seg').value = seg;
  const draw = () => {
    const l = segList($('seg').value, $('q').value.trim());
    $('cl').innerHTML = `<div class="muted" style="margin-bottom:6px">${l.length} زبون</div>` + (l.length ? `<table><tr><th>الزبون</th><th>الطلبات</th><th>آخر طلب</th><th>يحب</th><th></th></tr>` + l.slice(0, 300).map(c => `<tr>
      <td><b>${esc(c.name || '-')}</b>${c.has_push ? ' 🔔' : ''}<br><span dir="ltr" class="muted">${esc(c.phone)}</span>${c.area ? `<br><span class="muted">📍 ${esc(c.area)}</span>` : ''}</td>
      <td><b>${c.orders}</b><br><span class="muted">${fmtIQD(c.spent)}</span></td>
      <td>${agoTxt(c.last_at)}<br><span class="muted">${(c.last_items || []).map(esc).join('، ')}</span></td>
      <td class="muted">${(c.favorites || []).map(esc).join('، ')}</td>
      <td><a class="btn g" style="text-decoration:none;padding:5px 10px" target="_blank" href="https://wa.me/${intl(c.phone)}">واتساب</a></td></tr>`).join('') + '</table>' : '<div class="muted">ماكو زبائن بهذي المجموعة.</div>');
    return l;
  };

      <td>${new Date(c.created_at).toLocaleString('ar-IQ', { timeZone: 'Asia/Baghdad', hour: 'numeric', minute: '2-digit', day: 'numeric', month: 'numeric' })}</td>
      <td><b>${esc(c.name || '-')}</b><br><span dir="ltr">${esc(c.phone)}</span></td>
      <td><a class="btn s" style="text-decoration:none;padding:5px 10px" href="tel:${esc(c.phone)}">اتصال</a></td>
      <td>${c.done ? '✓ تم' : `<button class="btn" data-cbd="${c.id}" style="padding:5px 10px">تم</button>`}</td></tr>`).join('') + '</table>' : '<div class="muted">ماكو طلبات اتصال.</div>';
    $('cbl').querySelectorAll('[data-cbd]').forEach(b => b.onclick = async () => { await call('bunz_admin_callback_done', { cb_id: +b.dataset.cbd }); CBS.find(c => c.id == b.dataset.cbd).done = true; draw(); loadCalls(true); });
  };
  draw();
  $('ps').onclick = async () => {
    const title = $('pt').value.trim(), body = $('pb').value.trim(), url = $('pu').value.trim();
    if (!title || !body) return toast('اكتب العنوان والنص');
    if (!confirm('ترسل الإشعار لـ ' + PUSHN + ' زبون؟')) return;
    $('ps').disabled = true; $('pr').textContent = '... جاري الإرسال (أول مرة ممكن ياخذ دقيقة)';
    try {
      const r = await fetch(BUNZ.PUSH_URL + '/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: PIN, title, body, url }) });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      $('pr').textContent = '✓ وصل لـ ' + j.sent + ' زبون' + (j.removed ? ' (انحذف ' + j.removed + ' جهاز قديم)' : '');
      loadCalls(true);
    } catch (e) { $('pr').textContent = 'ما انرسل: ' + e.message; }
    $('ps').disabled = false;
  };
}

        <ul>${o.items.map(l => `<li>${l.qty}× ${esc(l.name)}${l.options ? ' <span class="muted">(' + esc(l.options) + ')</span>' : ''}${l.note ? '<br><b style="color:var(--red)">📝 ' + esc(l.note) + '</b>' : ''}</li>`).join('')}</ul>
        ${o.address_note ? `<div class="muted">🏠 ${esc(o.address_note)}</div>` : ''}${o.notes ? `<div>📝 ${esc(o.notes)}</div>` : ''}
        <div class="row" style="margin-top:8px">
          <a class="btn g" style="text-decoration:none;padding:6px 12px" target="_blank" href="https://wa.me/964${o.phone.slice(1)}">واتساب ${esc(o.phone)}</a>
          <a class="btn s" style="text-decoration:none;padding:6px 12px" href="tel:${esc(o.phone)}">اتصال</a>
          <a class="btn y" style="text-decoration:none;padding:6px 12px" target="_blank" href="r.html?t=${o.token}">🧾 الفاتورة</a>
          ${o.lat ? `<a class="btn s" style="text-decoration:none;padding:6px 12px" target="_blank" href="https://maps.google.com/?q=${o.lat},${o.lng}">الموقع 📍</a>` : ''}
          <button class="btn s" style="padding:6px 12px" data-label="${o.id}">🏷️ ستيكر الكيس</button>
        </div>
        ${o.order_type === 'delivery' && !['done', 'cancelled'].includes(o.status) ? `<div class="row" style="margin-top:8px">${driverSelect(o)}<button class="btn g" data-senddrv="${o.id}" style="padding:6px 12px">إرسال للدلفري بواتساب</button>${o.driver_name ? `<span class="pill">🛵 ${esc(o.driver_name)}</span>` : ''}</div>` : ''}
        <div class="row st" style="margin-top:10px">${Object.entries(ST).map(([k, v]) => `<button data-o="${o.id}" data-s="${k}" class="${o.status === k ? 'on' : ''}">${v}</button>`).join('')}</div>

function bindItems() {
  document.querySelectorAll('[data-item]').forEach(el => {
    const id = +el.dataset.item, f = n => el.querySelector(`[data-f="${n}"]`);

      f('options').value = b.dataset.preset === 'meat' ? JSON.stringify([{ name: 'اختر نوع اللحم', min: 1, max: 1, mode: 'single', choices: [{ name: 'سماش', price: 0 }, { name: 'كلاسيك', price: 0 }] }], null, 1) : '[]';
    });
    el.querySelector('[data-save]').onclick = async () => {
      let options; try { options = JSON.parse(f('options').value || '[]'); } catch { return toast('صيغة الخيارات غلط'); }
      await call('bunz_admin_save_item', { v: { id, name: f('name').value, price: +f('price').value, description: f('description').value, image_url: f('image_url').value,
        active: f('active').checked, sold_out: f('sold_out').checked, featured: f('featured').checked, category_id: +f('category_id').value, sort: +f('sort').value, options } });
      toast('انحفظ ✓'); await refresh();
    };
    ['sold_out', 'active'].forEach(n => f(n).onchange = async () => { await call('bunz_admin_save_item', { v: { id, [n]: f(n).checked } }); toast('انحفظ ✓'); });
    el.querySelector('[data-link]').onclick = () => { const u = location.origin + location.pathname.replace(/admin\.html$/, '') + '?item=' + id; navigator.clipboard.writeText(u).then(() => toast('انسخ ✓ ' + u), () => prompt('انسخ الرابط:', u)); };
    el.querySelector('[data-del]').onclick = async () => { if (!confirm('متأكد تحذف هذا الأيتم؟')) return; await call('bunz_admin_save_item', { v: { id, delete: true } }); await refresh(); menu(); };
  });
}

let amap;
function delivery() {
  const s = D.settings;
  $('view').innerHTML = `
    <div class="card"><h2>طريقة حساب التوصيل</h2>
      <div class="row"><label class="tg"><input type="radio" name="mode" value="tiers" ${s.delivery_mode === 'tiers' ? 'checked' : ''}> حسب المسافة</label>

      <div id="flatBox"><label>سعر التوصيل الثابت (د.ع)</label><input class="i" id="flat" type="number" step="250" value="${s.flat_fee}"></div>
      <div id="tiersBox"><label>شرائح المسافة</label>
        <table><thead><tr><th>لحد (كم)</th><th>السعر (د.ع)</th><th></th></tr></thead><tbody id="tiers"></tbody></table>
        <button class="btn s" id="addTier" style="margin-top:8px">+ شريحة</button>
        <div class="muted" style="margin-top:6px">مثال: لحد 1 كم = 1,000 · لحد 3 كم = 2,000. المسافة تنحسب بخط مستقيم من المطعم لموقع الزبون.</div></div>
      <div class="grid2">
        <div><label>أبعد مسافة نوصلها (كم)</label><input class="i" id="maxkm" type="number" step="0.5" value="${s.max_km}"></div>
        <div><label>توصيل مجاني فوق مبلغ (0 = لا)</label><input class="i" id="free" type="number" step="1000" value="${s.free_delivery_above}"></div>
        <div><label>أقل مبلغ للطلب (0 = لا)</label><input class="i" id="minord" type="number" step="1000" value="${s.min_order}"></div>
      </div>
      <div class="row" style="margin-top:10px"><label class="tg"><input type="checkbox" id="den" ${s.delivery_enabled ? 'checked' : ''}> التوصيل مفعّل</label><label class="tg"><input type="checkbox" id="pen" ${s.pickup_enabled ? 'checked' : ''}> الاستلام من المطعم مفعّل</label></div>
    </div>
    <div class="card"><h2>موقع المطعم</h2>
      <div class="muted">حرّك الدبوس لمكان المطعم بالضبط، أو اضغط "موقعي الحالي" وإنت بالمطعم.</div>
      <div id="map"></div>
      <div class="row" style="margin-top:8px"><button class="btn s" id="here">📍 موقعي الحالي</button><span class="muted" id="ll"></span></div>
    </div>
    <button class="btn y" id="saveDel" style="width:100%;padding:14px">حفظ إعدادات التوصيل</button>`;
  let tiers = JSON.parse(JSON.stringify(s.tiers)), lat = s.rest_lat, lng = s.rest_lng;
  const drawTiers = () => {
    $('tiers').innerHTML = tiers.map((t, k) => `<tr><td><input class="i" type="number" step="0.1" value="${t.upto_km}" data-k="${k}" data-x="upto_km"></td><td><input class="i" type="number" step="250" value="${t.fee}" data-k="${k}" data-x="fee"></td><td><button class="btn r" data-rm="${k}">×</button></td></tr>`).join('');
    $('tiers').querySelectorAll('input').forEach(x => x.oninput = () => tiers[+x.dataset.k][x.dataset.x] = +x.value);
    $('tiers').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { tiers.splice(+b.dataset.rm, 1); drawTiers(); });
  };
  const mode = () => document.querySelector('[name=mode]:checked').value;
  const vis = () => { $('flatBox').style.display = mode() === 'flat' ? 'block' : 'none'; $('tiersBox').style.display = mode() === 'tiers' ? 'block' : 'none'; };
  document.querySelectorAll('[name=mode]').forEach(r => r.onchange = vis); vis(); drawTiers();
  $('addTier').onclick = () => { const last = tiers[tiers.length - 1]; tiers.push({ upto_km: last ? last.upto_km + 1 : 1, fee: last ? last.fee + 1000 : 1000 }); drawTiers(); };
  amap = L.map('map').setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(amap);
  const mk = L.marker([lat, lng], { draggable: true }).addTo(amap);
  const setLL = (a, b) => { lat = a; lng = b; mk.setLatLng([a, b]); $('ll').textContent = a.toFixed(5) + ', ' + b.toFixed(5); };
  setLL(lat, lng);
  mk.on('dragend', () => { const p = mk.getLatLng(); setLL(p.lat, p.lng); });
  amap.on('click', e => setLL(e.latlng.lat, e.latlng.lng));
  $('here').onclick = () => navigator.geolocation.getCurrentPosition(p => { setLL(p.coords.latitude, p.coords.longitude); amap.setView([lat, lng], 17); }, () => toast('ما گدرت آخذ الموقع'), { enableHighAccuracy: true });
  $('saveDel').onclick = async () => {
    tiers = tiers.filter(t => t.upto_km > 0).sort((a, b) => a.upto_km - b.upto_km);
    await call('bunz_admin_save_settings', { v: { delivery_mode: mode(), flat_fee: +$('flat').value, tiers, max_km: +$('maxkm').value, free_delivery_above: +$('free').value,
      min_order: +$('minord').value, delivery_enabled: $('den').checked, pickup_enabled: $('pen').checked, rest_lat: lat, rest_lng: lng } });
    toast('انحفظ ✓'); await refresh(); delivery();
  };
}

  $('saveSet').onclick = async () => {
    let wa = $('wa').value.replace(/\D/g, ''); if (wa.startsWith('0')) wa = '964' + wa.slice(1);
    if (!/^9647\d{9}$/.test(wa)) return toast('رقم الواتساب لازم يكون مثل 07XXXXXXXXX');
    const np = $('np').value.trim(); if (np && np.length < 6) return toast('الرمز لازم 6 أرقام أو أكثر');
    await call('bunz_admin_save_settings', { v: { whatsapp: wa, phone_display: $('ph').value, address: $('addr').value, open_time: $('ot').value, close_time: $('ct').value, open_override: $('ov').value, announcement: $('ann').value, new_pin: np || null } });
    if (np) { PIN = np; sessionStorage.setItem('bunz_pin', np); }
    await call('bunz_admin_save_drivers', { d: drv.filter(d => d.name.trim()).map(d => { let p = String(d.phone || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '964' + p.slice(1); return { name: d.name.trim(), phone: p }; }) });
    if (+$('alA').value !== s.alert_accept_min || +$('alR').value !== s.alert_ready_min || +$('alP').value !== s.alert_pickup_min) await call('bunz_admin_set_alerts', { accept_min: +$('alA').value, ready_min: +$('alR').value, pickup_min: +$('alP').value });
    if ($('eta').value.trim() && $('eta').value.trim() !== (s.eta_text || '')) await call('bunz_admin_set_eta', { eta: $('eta').value.trim() });
    toast('انحفظ ✓'); await refresh(); settings();
  };
}

// ---------- QR / sources ----------
function qr() {
  const base = location.origin + location.pathname.replace(/admin\.html$/, '');
  $('view').innerHTML = `
    <div class="card"><h2>رابط جديد (مركز ألعاب، إعلان، صفحة)</h2>
      <div class="muted">كل مكان ياخذ رابط وQR خاص بي، فتعرف كل طلب منين إجه.</div>
      <div class="grid2"><div><label>الاسم</label><input class="i" id="sn" placeholder="مثلاً: مركز ألعاب الأبطال"></div>
      <div><label>رمز بالإنگليزي (بدون مسافات)</label><input class="i" id="sc" dir="ltr" placeholder="abtal"></div></div>
      <button class="btn" id="addSrc" style="margin-top:10px">إنشاء</button>
    </div>
    <div class="card"><div class="qr"><canvas id="q_main"></canvas><div><b>الرابط العام</b><div class="muted" dir="ltr">${esc(base)}</div>
      <div class="row" style="margin-top:6px"><button class="btn s" data-copy="${esc(base)}">نسخ</button><button class="btn s" data-dl="q_main" data-name="10bunz-qr">تنزيل QR</button></div></div></div></div>
    ${D.sources.map(s => { const url = base + '?src=' + s.code; return `<div class="card"><div class="qr"><canvas id="q_${s.code}"></canvas><div style="flex:1">
      <b>${esc(s.name)}</b> <span class="pill">${s.orders} طلب · ${fmtIQD(s.revenue)}</span>
      <div class="muted" dir="ltr" style="word-break:break-all">${esc(url)}</div>
      <div class="row" style="margin-top:6px"><button class="btn s" data-copy="${esc(url)}">نسخ</button><button class="btn s" data-dl="q_${s.code}" data-name="10bunz-qr-${s.code}">تنزيل QR</button><button class="btn r" data-rmsrc="${s.code}">حذف</button></div>
    </div></div></div>`; }).join('')}`;
  const drawQR = (id, url) => { const q = qrcode(0, 'M'); q.addData(url); q.make(); const n = q.getModuleCount(), c = $(id), sc = 12, m = 4; c.width = c.height = (n + m * 2) * sc; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#2c318b'; for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * sc, (r + m) * sc, sc, sc); };
  drawQR('q_main', base); D.sources.forEach(s => drawQR('q_' + s.code, base + '?src=' + s.code));
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('انسخ ✓')));
  document.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { const a = document.createElement('a'); a.href = $(b.dataset.dl).toDataURL('image/png'); a.download = b.dataset.name + '.png'; a.click(); });
  document.querySelectorAll('[data-rmsrc]').forEach(b => b.onclick = async () => { if (!confirm('حذف الرابط؟ الطلبات القديمة تبقى.')) return; await call('bunz_admin_save_source', { v: { code: b.dataset.rmsrc, delete: true } }); await refresh(); qr(); });
  $('addSrc').onclick = async () => {
    const code = $('sc').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, ''), name = $('sn').value.trim();
    if (!name || code.length < 2) return toast('اكتب الاسم والرمز');
    await call('bunz_admin_save_source', { v: { code, name } }); await refresh(); qr();
  };
}

if (BUNZ.STATIC) { $('login').innerHTML = '<h2>لوحة التحكم</h2><div class="muted">لوحة التحكم تتفعل بعد ربط قاعدة البيانات. لحد ذاك، أي تعديل على الأسعار أو التوصيل أو الدوام يصير عن طريق Claude.</div>'; }
else if (PIN) refresh().then(start).catch(() => logout());
</script>
