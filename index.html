<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10 BUNZ | اطلب مباشرة</title>
<meta name="description" content="اطلب برگر 10 BUNZ مباشرة من المطعم، توصيل لباب البيت بكركوك.">
<meta name="theme-color" content="#2c318b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="10 BUNZ · اطلب مباشرة">
<meta property="og:description" content="برگر 10 BUNZ يوصلك لباب البيت بكركوك. اطلب مباشرة من المطعم.">
<meta property="og:image" content="https://10bunz.com/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#2c318b;--navy2:#1d2166;--blue:#3b42c4;--yellow:#ffd23f;--cyan:#5fd4ff;--bg:#f5f6fb;--card:#fff;--text:#2c318b;--muted:#5b6585;--line:#e3e7f2;--red:#e5484d;--green:#1f9d55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif}
button,input,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer}
.hero{background:#2c318b;color:#fff;padding:22px 16px 30px;position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 0% 0%,#ffffff14 0,transparent 60%),radial-gradient(50% 70% at 100% 100%,#ffd23f1f 0,transparent 60%),repeating-linear-gradient(135deg,#ffffff07 0 2px,transparent 2px 22px);pointer-events:none}
.hero>*{position:relative}
.hero .top{display:flex;align-items:center;gap:16px;max-width:900px;margin:0 auto}
.logo{height:92px;width:auto;flex:none;filter:drop-shadow(0 6px 14px #0003)}
.hero h1{margin:0;font-size:24px;font-weight:900;line-height:1.3}
.hero h1 span{color:var(--yellow)}
.hero .sub{opacity:.85;font-size:13px;margin-top:2px}
.hero .bdg{position:absolute;top:0;left:0}
@media(min-width:680px){.logo{height:120px}.hero h1{font-size:30px}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.open{background:#1f9d5533;color:#7dffb0}.badge.closed{background:#e5484d33;color:#ffb3b5}
.hero .badge{margin-bottom:6px}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.perk{max-width:900px;margin:14px auto 0;background:var(--yellow);color:var(--navy);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;display:none}
.cats{position:sticky;top:0;z-index:20;background:#f5f6fbee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cats .row{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:900px;margin:0 auto;scrollbar-width:none}
.cats .row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;border-radius:99px;font-weight:700;font-size:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 12px #2c318b40}
main{max-width:900px;margin:0 auto;padding:6px 16px 120px}
h2.sec{font-size:20px;font-weight:900;margin:26px 0 12px;scroll-margin-top:64px;display:flex;align-items:center;gap:10px}
h2.sec:before{content:"";width:6px;height:22px;border-radius:4px;background:var(--yellow);flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{cursor:pointer;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px #2c318b0f,0 8px 24px #2c318b12;transition:transform .15s;display:flex;flex-direction:column;border:0;padding:0;text-align:right;color:inherit}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e9edf7}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .n{font-weight:800;font-size:15px;line-height:1.35}
.card .d{font-size:12px;color:var(--muted)}
.card .f{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.card .p{font-weight:900;color:var(--navy);font-size:16px}
.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{transform:translateY(-3px)}}
.add{width:38px;height:38px;border-radius:14px;background:var(--yellow);color:var(--navy)!important;font-weight:900;box-shadow:0 4px 10px #ffd23f66;color:#fff;border:0;font-size:22px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
.card.out{opacity:.5}.card.out .add{background:#999}
.tag{position:absolute;top:8px;right:8px;background:var(--yellow);color:var(--navy);font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.imgw{position:relative}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:876px;margin:0 auto;background:var(--navy);color:#fff;border:0;border-radius:18px;padding:14px 18px;display:none;align-items:center;justify-content:space-between;font-weight:800;font-size:16px;box-shadow:0 10px 30px #2c318b55}
.cartbar .cnt{background:var(--yellow);color:var(--navy);border-radius:10px;padding:2px 10px;margin-left:10px}
.sheet-bg{position:fixed;inset:0;background:#2c318b88;z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:680px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .hd{position:sticky;top:0;background:#fff;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet .hd b{font-size:18px;font-weight:900}
.x{width:36px;height:36px;border-radius:12px;border:0;background:var(--bg);font-size:20px}
.pad{padding:16px 18px}
.big-img{width:100%;max-height:280px;object-fit:cover;display:block;background:#e9edf7}
.grp{margin:14px 0}
.grp h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.grp h4 small{font-weight:600;color:var(--muted);font-size:12px}
.opt{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-weight:700;background:#fff;width:100%;color:var(--text)}
.opt.on{border-color:var(--blue);background:#3b42c40d}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt.on .dot{border:6px solid var(--blue)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:11px;border:0;background:var(--bg);font-size:20px;font-weight:800;color:var(--navy)}
.stepper span{min-width:18px;text-align:center;font-weight:900}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:17px;background:var(--navy);color:#fff}
.btn.y{background:var(--yellow);color:var(--navy)}
.btn.g{background:#25d366;color:#fff}
.btn:disabled{opacity:.45}
.foot{display:flex;gap:12px;align-items:center;padding:0 18px}
.line{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.line img{width:54px;height:54px;border-radius:12px;object-fit:cover}
.line .t{flex:1}.line .t b{display:block;font-size:14px}.line .t small{color:var(--muted);font-size:12px}
.line .pr{font-weight:800;font-size:14px;white-space:nowrap}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px #2c318b14}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
input.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--text)}
input.i:focus,textarea.i:focus{outline:none;border-color:var(--blue)}
.mapbox{position:relative;height:230px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line)}
#map{position:absolute;inset:0;z-index:1}
.pin{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-100%);pointer-events:none;transition:transform .15s}
.pinshadow{position:absolute;left:50%;top:50%;width:14px;height:5px;margin:-2px 0 0 -7px;border-radius:50%;background:#0006;z-index:4;pointer-events:none}
.mapbox.moving .pin{transform:translate(-50%,-118%)}
.locate{position:absolute;bottom:10px;left:10px;z-index:6;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--blue);font-size:24px;box-shadow:0 3px 12px #0003}
.maptip{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:#2c318bdd;color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.addr{margin-top:10px;background:var(--bg);border-radius:14px;padding:10px 14px;font-size:14px;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.addr small{color:var(--muted);font-size:12px}
.hint.bad{color:var(--red);font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.sum{background:var(--bg);border-radius:16px;padding:12px 14px;margin-top:16px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum .tot{font-weight:900;font-size:18px;border-top:1px dashed #c9d0e3;margin-top:6px;padding-top:10px}
.err{color:var(--red);font-weight:700;font-size:13px;margin-top:8px}
.ok{text-align:center;padding:30px 20px}
.ok .num{font-size:40px;font-weight:900;color:var(--blue)}
.closedmsg{background:#fff0f0;color:var(--red);border-radius:14px;padding:12px;font-weight:800;text-align:center;margin-top:12px}
.skel{height:220px;border-radius:18px;background:linear-gradient(90deg,#e9edf7,#f6f8fc,#e9edf7);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.hrow{max-width:900px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eta{background:#ffffff1f;border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}
.cbb{border:0;background:#fff;color:var(--navy);border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px}
.toastc{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2c318bf0;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;display:none;max-width:92%;text-align:center;box-shadow:0 8px 24px #0004}
.cartbar.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.04)}}
.edit{border:0;background:none;color:var(--blue);font-weight:800;font-size:12px;padding:0 6px}
.appcard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin:14px 0 0;display:flex;gap:12px;align-items:center}
.appcard img{width:44px;height:44px;border-radius:12px}
.appcard .t{flex:1;font-size:13px;color:var(--muted)}.appcard .t b{display:block;color:var(--navy);font-size:15px}
.appcard .bs{display:flex;flex-direction:column;gap:6px}
.appcard .bs button{border:0;border-radius:11px;padding:7px 12px;font-weight:800;font-size:13px;background:var(--navy);color:#fff;white-space:nowrap}
.appcard .bs button.y{background:var(--yellow);color:var(--navy)}
.appcard .xx{border:0;background:none;color:var(--muted);font-size:18px;align-self:flex-start}
.best .card .n{font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px 110px}
footer img{height:70px;display:block;margin:0 auto 10px;opacity:.9}
footer a{color:var(--navy);font-weight:800}
</style>
</head>
<body>
<header class="hero">
  <div class="top">
    <img class="logo" id="logo" src="logo-white.png" alt="10 BUNZ · More than a Burger">
    <div style="flex:1">
      <span class="badge" id="openBadge"></span>
      <h1>اطلب برگرك <span>مباشرة</span><br>من المطعم لباب بيتك</h1>
      <div class="sub" id="hours">كركوك · توصيل واستلام</div>
    </div>
  </div>
  <div class="perk" id="perk"></div>
  <div class="hrow"><span class="eta" id="eta" style="display:none"></span><button class="cbb" id="cbBtn">📞 اتصلوا بيه</button></div>
</header>
<nav class="cats"><div class="row" id="cats"></div></nav>
<main id="menu"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
<footer id="foot"></footer>

<button class="cartbar" id="cartbar"><span><span class="cnt" id="cartCnt">0</span>عرض السلة</span><span id="cartTot"></span></button>

<div class="sheet-bg" id="itemBg"><div class="sheet" id="itemSheet"></div></div>
<div class="sheet-bg" id="cbBg"><div class="sheet" id="cbSheet"></div></div>
<div class="toastc" id="toast"></div>
<div class="sheet-bg" id="cartBg"><div class="sheet" id="cartSheet"></div></div>

<script src="config.js?v=6"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const S = { settings: null, cats: [], items: [], cart: [], type: 'delivery', loc: null, sending: false };
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('bunz_' + k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem('bunz_' + k, JSON.stringify(v)) } catch {} } };

// attribution: ?src=code (QR per gaming center / ad)
const qs = new URLSearchParams(location.search);
if (qs.get('src')) store.set('src', { code: qs.get('src').toLowerCase().slice(0, 40), at: Date.now() });
function source() { const s = store.get('src'); return s && Date.now() - s.at < 30 * 864e5 ? s.code : null; }

S.cart = store.get('cart', []);

async function load() {
  try {
    const [settings, cats, items] = await Promise.all([
      bunzApi.rpc('bunz_public_settings'),
      bunzApi.get('bunz_categories?select=*&order=sort,id'),
      bunzApi.get('bunz_items?select=*&order=sort,id')
    ]);
    S.settings = settings; S.cats = cats; S.items = items;
    S.cart = S.cart.filter(l => items.some(i => i.id === l.id && !i.sold_out));
    if (!settings.delivery_enabled) S.type = 'pickup';
    renderHeader(); renderMenu(); renderCartBar(); renderAppCard();
    const iid = +qs.get('item'); if (iid && !load.did) { load.did = 1; openItem(iid); }
  } catch (e) {
    $('menu').innerHTML = '<div class="closedmsg">صار خلل بالتحميل. حدّث الصفحة.</div>';
    console.error(e);
  }
}

function to12(t) { let [h, m] = t.split(':').map(Number); const ap = h < 12 ? 'ص' : 'م'; h = h % 12 || 12; return h + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ap; }

function renderHeader() {
  const s = S.settings;
  $('openBadge').className = 'badge ' + (s.is_open ? 'open' : 'closed');
  $('openBadge').innerHTML = '<i></i>' + (s.is_open ? 'مفتوح' : 'مغلق');
  $('hours').textContent = 'الدوام من ' + to12(s.open_time) + ' إلى ' + to12(s.close_time);
  if (s.delivery_enabled) { $('eta').style.display = ''; $('eta').textContent = '🛵 يوصلك خلال ' + (s.eta_text || '30–40 دقيقة'); } else $('eta').style.display = 'none';
  if (s.announcement) { $('perk').style.display = 'block'; $('perk').textContent = s.announcement; }
  $('foot').innerHTML = '<img src="logo.png" alt="10 BUNZ"><div><b>More than a Burger</b></div>' + esc(s.address) + (s.phone_display ? ' · <a href="tel:' + esc(s.phone_display) + '">' + esc(s.phone_display) + '</a>' : '');
}

function itemById(id) { return S.items.find(i => i.id === id); }

function bestsellers() {
  const ok = i => i && !i.sold_out, out = [];
  const push = i => { if (ok(i) && !out.includes(i) && out.length < 4) out.push(i); };
  (S.settings.bestsellers || []).forEach(id => push(itemById(id)));
  S.items.filter(i => i.featured).forEach(push);
  S.items.forEach(push);
  return out;
}
function cardHtml(i, tag) {
  return `<div class="card${i.sold_out ? ' out' : ''}" data-i="${i.id}" role="button">
        <div class="imgw"><img loading="lazy" src="${esc(i.image_url)}" alt="${esc(i.name)}" onerror="this.style.visibility='hidden'">${i.sold_out ? '<span class="tag">نفد اليوم</span>' : tag ? `<span class="tag">${tag}</span>` : ''}</div>
        <div class="b"><div class="n">${esc(i.name)}</div>${i.description ? `<div class="d">${esc(i.description)}</div>` : ''}
        <div class="f"><span class="p">${fmtIQD(i.price)}</span><button class="add" data-add="${i.id}" aria-label="أضف">+</button></div></div>
      </div>`;
}
function renderMenu() {
  const cats = S.cats.filter(c => S.items.some(i => i.category_id === c.id));
  const best = bestsellers();
  $('cats').innerHTML = (best.length ? '<button class="chip on" data-c="best">🔥 الأكثر طلباً</button>' : '') +
    cats.map((c, k) => `<button class="chip${k || best.length ? '' : ' on'}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
  $('menu').innerHTML = '<div id="appCard"></div>' +
    (best.length ? `<h2 class="sec" id="cbest">🔥 الأكثر طلباً</h2><div class="grid best">${best.map(i => cardHtml(i, '🔥 الأشهر')).join('')}</div>` : '') +
    cats.map(c => `<h2 class="sec" id="c${c.id}">${esc(c.name)}</h2><div class="grid">` +
    S.items.filter(i => i.category_id === c.id).map(i => cardHtml(i, i.featured ? 'مميز' : '')).join('') + '</div>').join('');
  $('cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { document.getElementById('c' + b.dataset.c).scrollIntoView({ behavior: 'smooth' }); });
  $('menu').querySelectorAll('.card').forEach(b => b.onclick = e => { const a = e.target.closest('[data-add]'); if (a) quickAdd(+a.dataset.add); else openItem(+b.dataset.i); });
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { const id = e.target.id.slice(1); $('cats').querySelectorAll('.chip').forEach(c => { const on = c.dataset.c === id; c.classList.toggle('on', on); if (on) c.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }); }
  }), { rootMargin: '-70px 0px -70% 0px' });
  document.querySelectorAll('h2.sec').forEach(h => obs.observe(h));
}

// ---------- item sheet ----------
let cur = null;
function openItem(id, edit) {
  const it = itemById(id); if (!it || it.sold_out) return;
  const l = edit != null ? S.cart[edit] : null;
  cur = l ? { it, qty: l.qty, sel: JSON.parse(JSON.stringify(l.sel)), edit, note: l.note || '' } : { it, qty: 1, sel: defaultSel(it) || it.options.map(() => []), edit: null, note: '' };
  drawItem(); show('itemBg');
}
// most popular choice for one-tap add: "سماش" if present, else the first choice of each required single group
function defaultSel(it) {
  const sel = [];
  for (const g of it.options) {
    if (!g.min) { sel.push([]); continue; }
    if (g.mode === 'count' || (g.max || 1) > 1) return null;
    let ci = g.choices.findIndex(c => /سماش/.test(c.name)); if (ci < 0) ci = 0;
    sel.push([{ i: ci, n: 1 }]);
  }
  return sel;
}
function addLine(it, sel, qty, note) {
  note = (note || '').trim().slice(0, 120);
  const key = it.id + ':' + JSON.stringify(sel) + ':' + note;
  const ex = S.cart.find(l => l.key === key);
  if (ex) ex.qty = Math.min(20, ex.qty + qty); else S.cart.push({ key, id: it.id, qty, sel, note });
}
function quickAdd(id) {
  const it = itemById(id); if (!it || it.sold_out) return;
  const sel = defaultSel(it); if (!sel) return openItem(id);
  addLine(it, sel, 1); saveCart(); renderCartBar();
  const lbl = optLabel(it, sel);
  toast('✓ انضاف ' + it.name + (lbl ? ' (' + lbl + ')' : '') + (lbl ? ' · تگدر تغيّره بالسلة' : ''));
}

function quote() {

  const d = haversine(s.rest_lat, s.rest_lng, S.loc.lat, S.loc.lng);
  const fee = deliveryFee(s, d, sub);

}

let geoTimer, geoSeq = 0;
function setAddr(html) { if ($('addrLine')) $('addrLine').innerHTML = html; }
function reverseGeocode(lat, lng) {
  clearTimeout(geoTimer);
  const seq = ++geoSeq;
  geoTimer = setTimeout(async () => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=ar&lat=${lat}&lon=${lng}`);
      const j = await r.json(); if (seq !== geoSeq) return;
      const a = j.address || {};
      const parts = [a.road, a.neighbourhood || a.suburb || a.quarter || a.residential, a.city || a.town || a.county].filter(Boolean);
      S.loc.label = parts.join('، ');
      setAddr('📍 <b>' + esc(parts[0] || 'موقعك المحدد') + '</b>' + (parts.length > 1 ? '<small>' + esc(parts.slice(1).join('، ')) + '</small>' : ''));
    } catch { if (seq === geoSeq) setAddr('📍 <b>موقعك المحدد على الخريطة</b>'); }
  }, 500);
}
function onLoc(lat, lng, acc) {
  S.loc = { lat, lng, acc, fresh: true };
  store.set('loc', { lat, lng, at: Date.now() });
  updateTotals(); reverseGeocode(lat, lng);
}
function locate(auto) {
  if (!navigator.geolocation) return locFail();
  setAddr('<span class="spin"></span> جاري تحديد موقعك...');
  navigator.geolocation.getCurrentPosition(p => {
    if (map) map.setView([p.coords.latitude, p.coords.longitude], 17, { animate: !auto });
    onLoc(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
    if (p.coords.accuracy > 150 && $('mapTip')) $('mapTip').textContent = 'الموقع تقريبي، حرّك الخريطة حتى يصير الدبوس على بيتك بالضبط';
  }, locFail, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}
function locFail() {
  if (S.loc) return reverseGeocode(S.loc.lat, S.loc.lng);
  setAddr('<b style="color:var(--red)">ما گدرنا نحدد موقعك تلقائياً</b><small>فعّل الموقع (GPS) واضغط ◎، أو حرّك الخريطة لمكان بيتك</small>');
}
function initMap() {
  const s = S.settings, saved = store.get('loc');
  map = null;
  if (!window.L) { $('locate').onclick = () => locate(false); if (S.loc && S.loc.fresh) reverseGeocode(S.loc.lat, S.loc.lng); else locate(true); return; }
  if (!S.loc && saved && Date.now() - saved.at < 3 * 864e5) S.loc = { lat: saved.lat, lng: saved.lng };
  const c = S.loc || { lat: s.rest_lat, lng: s.rest_lng };
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([c.lat, c.lng], S.loc ? 17 : 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  const box = $('map').parentElement;
  map.on('movestart', () => box.classList.add('moving'));
  map.on('moveend', e => { box.classList.remove('moving'); if (map._userMoved) { const m = map.getCenter(); onLoc(m.lat, m.lng); } });
  map.on('dragstart zoomstart', () => { map._userMoved = true; });
  $('locate').onclick = () => { map._userMoved = false; locate(false); };
  if (S.loc && S.loc.fresh) reverseGeocode(S.loc.lat, S.loc.lng); else locate(true);
}

async function send() {
  if (S.sending) return;
  const err = $('err'); err.textContent = '';
  const name = $('fName').value.trim(), phone = $('fPhone').value.replace(/\D/g, '');
  if (name.length < 2) return err.textContent = 'اكتب اسمك';
  if (!/^(07\d{9}|9647\d{9})$/.test(phone)) return err.textContent = 'رقم الهاتف لازم يكون مثل 07XXXXXXXXX';
  const notes = $('fNotes').value.trim(), addr = $('fAddr') ? $('fAddr').value.trim() : '';
  const payload = { name, phone, type: S.type, notes, address_note: addr, source: source(), location_label: S.type === 'delivery' && S.loc ? (S.loc.label || '') : '',
    lat: S.type === 'delivery' ? S.loc.lat : null, lng: S.type === 'delivery' ? S.loc.lng : null,
    items: S.cart.map(l => ({ id: l.id, qty: l.qty, sel: l.sel, note: l.note || '' })) };
  S.sending = true; $('sendBtn').disabled = true; $('sendBtn').textContent = '... جاري الإرسال';
  try {
    const r = await bunzApi.rpc('bunz_place_order', { p: payload });
    if (r.error) throw r;
    const msg = waText(r, payload);
    const url = 'https://wa.me/' + r.whatsapp + '?text=' + encodeURIComponent(msg);
    store.set('last', { no: r.order_no, url, phone, at: Date.now() });
    S.cart = []; saveCart(); renderCartBar();
    done(r, url);
    location.href = url;
  } catch (e) {
    const m = { closed: 'المطعم مغلق هسه.', phone: 'رقم الهاتف غير صحيح.', name: 'اكتب اسمك.', out_of_range: 'موقعك خارج منطقة التوصيل. تگدر تختار استلام من المطعم.',
      item_unavailable: 'أحد الأيتمات خلص. حدّث الصفحة.', too_many: 'طلبات كثيرة من نفس الرقم. انتظر شوية.', min_order: 'المبلغ أقل من الحد الأدنى.', location: 'حدد موقعك.', option: 'اختار الخيارات المطلوبة.' };
    err.textContent = (e && m[e.error]) || 'صار خلل. حاول مرة ثانية.';
    $('sendBtn').disabled = false; $('sendBtn').textContent = 'إرسال الطلب على واتساب';
    if (e && e.error === 'item_unavailable') load();
    console.error(e);
  } finally { S.sending = false; }
}
function receiptUrl(r) { return location.origin + location.pathname.replace(/index\.html$/, '') + 'r.html?t=' + r.token; }
function waText(r, p) {
  if (r.token) {
    const line = '━━━━━━━━━━━━━━', n = r.lines.reduce((a, l) => a + l.qty, 0);

      '',
      '🧺 الطلب (' + n + ' قطعة):',
      ...r.lines.map(l => '▫️ ' + l.qty + '× ' + l.name + (l.options ? ' (' + l.options + ')' : '') + (l.note ? '\n      📝 ' + l.note : '')),
      '',
      '💰 المبلغ الكلي:  *' + fmtIQD(r.total) + '*',
      line, '🧾 الفاتورة الرسمية + QR الاستلام:', receiptUrl(r), line,
      '⚠️ المعتمد هو المبلغ بالفاتورة فقط'].join('\n');
  }
  const L = [];
  L.push('🍔 *طلب جديد #' + r.order_no + '* · 10 BUNZ');
  L.push('👤 ' + p.name + '  📞 ' + p.phone);
  L.push(p.type === 'delivery' ? '🛵 توصيل' : '🏃 استلام من المطعم');
  L.push('━━━━━━━━━━');
  r.lines.forEach(l => L.push(l.qty + '× ' + l.name + (l.options ? ' (' + l.options + ')' : '') + ' · ' + fmtIQD(l.line_total)));
  L.push('━━━━━━━━━━');
  L.push('المجموع: ' + fmtIQD(r.subtotal));
  if (p.type === 'delivery') L.push('التوصيل (' + (r.distance_m / 1000).toFixed(1) + ' كم): ' + (r.delivery_fee ? fmtIQD(r.delivery_fee) : 'مجاني'));
  L.push('*الكلي: ' + fmtIQD(r.total) + '*');
  if (p.type === 'delivery') {
    L.push('📍 الموقع: https://maps.google.com/?q=' + p.lat.toFixed(6) + ',' + p.lng.toFixed(6));
    if (S.loc && S.loc.label) L.push('🗺️ ' + S.loc.label);
    if (p.address_note) L.push('🏠 ' + p.address_note);

  return L.join('\n');
}

      <label class="f">الاسم (اختياري)</label><input class="i" id="cbName" value="${esc(me.name || '')}" placeholder="اسمك">
      <label class="f">رقم الهاتف</label><input class="i" id="cbPhone" type="tel" inputmode="tel" dir="ltr" style="text-align:right" value="${esc(me.phone || '')}" placeholder="07XX XXX XXXX">
      ${s.is_open === false ? `<div class="closedmsg">المطعم مغلق هسه، نتصل بيك أول ما نفتح الساعة ${to12(s.open_time)}</div>` : ''}
      <div class="err" id="cbErr"></div>
      <button class="btn y" id="cbSend" style="margin-top:14px">📞 اتصلوا بيه</button>
      ${s.phone_display ? `<a class="btn" style="display:block;text-decoration:none;text-align:center;margin-top:10px;background:var(--bg);color:var(--navy)" href="tel:${esc(s.phone_display)}">أو اتصل إنت هسه: <span dir="ltr">${esc(s.phone_display)}</span></a>` : ''}
    </div>`;
  $('cbSheet').querySelector('[data-close]').onclick = () => hide('cbBg');
  $('cbSend').onclick = async () => {
    const phone = $('cbPhone').value.replace(/\D/g, ''), name = $('cbName').value.trim();
    if (!/^(07\d{9}|9647\d{9})$/.test(phone)) return $('cbErr').textContent = 'الرقم لازم يكون مثل 07XXXXXXXXX';
    $('cbSend').disabled = true; $('cbSend').textContent = '... جاري الإرسال';
    try {
      const r = await bunzApi.rpc('bunz_request_callback', { p: { name, phone } });
      if (r.error) throw r;
      store.set('me', { ...store.get('me', {}), name: name || store.get('me', {}).name, phone });
      const line = '━━━━━━━━━━━━━━', t = new Date().toLocaleTimeString('ar-IQ', { timeZone: 'Asia/Baghdad', hour: 'numeric', minute: '2-digit' });
      const msg = [line, '📞 *طلب اتصال · 10 BUNZ*', line, '👤 الاسم:  *' + (name || 'بدون اسم') + '*', '📱 الرقم:  *' + phone + '*', '🕒 الوقت: ' + t, line,
        '✅ اتصلوا بيه وسجّلوا طلبه', 'tel:' + phone].join('\n');
      const wa = 'https://wa.me/' + s.whatsapp + '?text=' + encodeURIComponent(msg);
      $('cbSheet').innerHTML = `<div class="ok"><div style="font-size:54px">📞</div><div style="font-weight:900;font-size:20px">وصلنا رقمك</div>
        <div style="color:var(--muted);margin:8px 0 20px">اضغط <b>إرسال</b> بالواتساب حتى يوصلنا طلبك، وراح نتصل بيك على <b dir="ltr">${esc(phone)}</b> خلال دقايق.</div>
        <a class="btn g" style="display:block;text-decoration:none;text-align:center" href="${wa}">فتح واتساب</a>
        <button class="btn" style="margin-top:10px;background:var(--bg);color:var(--navy)" onclick="hide('cbBg')">تمام</button></div>`;
      if (s.whatsapp) location.href = wa;
    } catch (e) {
      $('cbErr').textContent = e && e.error === 'too_many' ? 'وصلنا طلبك قبل شوية، راح نتصل بيك.' : 'صار خلل، حاول مرة ثانية أو اتصل إنت مباشرة.';
      $('cbSend').disabled = false; $('cbSend').textContent = '📞 اتصلوا بيه';
    }
  };
  show('cbBg');
};

// ---------- add to home screen + push ----------
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderAppCard(); });
window.addEventListener('appinstalled', () => { installEvt = null; renderAppCard(); });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!BUNZ.VAPID_PUBLIC && (!isIOS() || isStandalone());
function renderAppCard(target) {
  const el = $(target || 'appCard'); if (!el) return;
  const ordered = !!store.get('last'), dismissed = Date.now() - (store.get('appx', 0)) < 5 * 864e5;
  if (!ordered || (dismissed && !target)) { el.innerHTML = ''; return; }
  const canInstall = !isStandalone() && (installEvt || isIOS());
  const canPush = pushOk() && Notification.permission === 'default';
  if (!canInstall && !canPush) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="appcard"><img src="icon-192.png" alt="">
    <div class="t"><b>${canInstall ? 'ضيف 10 BUNZ لشاشتك' : 'خلّي توصلك عروضنا'}</b>${canInstall ? 'يفتح مثل التطبيق، وتطلب بثواني' : 'إشعار "عرض الليلة 🔥" يوصلك أول واحد'}</div>
    <div class="bs">${canInstall ? '<button class="y" data-ins>📲 ضيف</button>' : ''}${canPush ? '<button data-push>🔔 فعّل العروض</button>' : ''}</div>
    ${target ? '' : '<button class="xx" data-x>×</button>'}</div>`;
  const ins = el.querySelector('[data-ins]'), pu = el.querySelector('[data-push]'), x = el.querySelector('[data-x]');
  if (ins) ins.onclick = async () => {
    if (installEvt) { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; renderAppCard(target); }
    else alert('على الآيفون:\n1) اضغط زر المشاركة ⬆️ تحت الشاشة\n2) اختار "إضافة إلى الشاشة الرئيسية"\n3) اضغط "إضافة"\n\nبعدها افتح 10 BUNZ من الأيقونة وفعّل الإشعارات 🔔');
  };
  if (pu) pu.onclick = async () => { await subscribePush(true); renderAppCard(target); };
  if (x) x.onclick = () => { store.set('appx', Date.now()); el.innerHTML = ''; };
}
function b64u(s) { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function subscribePush(ask) {
  try {
    if (!pushOk()) return;
    if (ask && Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(BUNZ.VAPID_PUBLIC) });
    const j = sub.toJSON(), last = store.get('last', {});
    if (!ask && store.get('pushsent') === j.endpoint) return;
    await bunzApi.rpc('bunz_push_subscribe', { p: { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, phone: last.phone || store.get('me', {}).phone || '' } });
    store.set('pushsent', j.endpoint);
    if (ask) toast('🔔 تم! راح توصلك عروضنا');
  } catch (e) { console.error(e); if (ask) toast('ما گدرنا نفعّل الإشعارات على هذا الجهاز'); }
}

load();
setInterval(() => bunzApi.rpc('bunz_public_settings').then(s => { S.settings = s; renderHeader(); }).catch(() => {}), 120000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(() => subscribePush(false)).catch(() => {});
</script>
