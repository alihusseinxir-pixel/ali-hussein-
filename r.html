<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>فاتورة 10 BUNZ</title>
<meta name="theme-color" content="#2c318b">
<link rel="icon" href="favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#2c318b;--deep:#1d2166;--yellow:#ffd23f;--bg:#f2f3f9;--line:#e3e5f0;--muted:#5d6385;--green:#1f9d55;--red:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--deep);font-family:Cairo,system-ui,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:14px 14px 40px}
.rc{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 10px 40px #2c318b1f}
.top{background:var(--navy);color:#fff;padding:16px 18px 54px;position:relative;overflow:hidden}
.top:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#ffffff08 0 2px,transparent 2px 20px)}
.top>*{position:relative}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:54px}
.brand b{display:block;font-size:15px;font-weight:900}.brand small{opacity:.8;font-size:12px}
.ticket{margin:-40px 16px 0;background:#fff;border-radius:20px;box-shadow:0 8px 24px #2c318b26;padding:14px 16px;position:relative;display:flex;align-items:center;gap:12px}
.ticket .n small{display:block;color:var(--muted);font-weight:800;font-size:12px}
.ticket .n div{font-size:44px;font-weight:900;line-height:1;color:var(--navy);letter-spacing:1px}
.ticket .t{margin-right:auto;text-align:left}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:900;background:var(--bg)}
.pill.st-new{background:#fff3c4;color:#8a6a00}.pill.st-preparing{background:#e6e8ff;color:var(--navy)}.pill.st-ready{background:#d9f7e6;color:#13703c}
.pill.st-on_the_way{background:#ede4ff;color:#5b2bb5}.pill.st-done{background:#e3f6ea;color:var(--green)}.pill.st-cancelled{background:#fde7e7;color:var(--red)}
.steps{display:flex;gap:4px;padding:16px 18px 4px}
.steps div{flex:1;text-align:center;font-size:11px;font-weight:800;color:#a9aec8}
.steps div:before{content:"";display:block;height:6px;border-radius:9px;background:#e6e8f2;margin-bottom:6px}
.steps div.on{color:var(--navy)}.steps div.on:before{background:var(--navy)}
.steps div.cur:before{background:var(--yellow)}
.qrbox{margin:14px 16px 4px;border:2px dashed #c9cde3;border-radius:20px;padding:14px;text-align:center}
.qrbox canvas{width:210px;height:210px;display:block;margin:0 auto}
.qrbox b{display:block;font-size:15px;margin-top:6px}.qrbox small{color:var(--muted);font-size:12px}
.sec{padding:14px 18px;border-bottom:1px dashed var(--line)}
.k{color:var(--muted);font-size:12px;font-weight:800;margin-bottom:2px}
.v{font-weight:800;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
table{width:100%;border-collapse:collapse}td{padding:7px 0;font-size:14px;vertical-align:top;border-bottom:1px solid #f0f1f7}tr:last-child td{border:0}td:last-child{text-align:left;white-space:nowrap;font-weight:800}
td small{color:var(--muted);display:block}
.qty{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--bg);font-weight:900;margin-left:6px}
.tot{font-size:24px;font-weight:900}
.due{background:var(--yellow);border-radius:16px;padding:12px 14px;margin-top:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:15px;background:var(--navy);color:#fff;font-family:inherit;cursor:pointer}
.btn.g{background:#25d366}.btn.s{background:var(--bg);color:var(--deep)}
.verified{color:var(--green);font-weight:800;font-size:12px;text-align:center;padding:12px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
@media print{body{background:#fff}.wrap{padding:0;max-width:80mm}.rc{box-shadow:none;border-radius:0}.noprint{display:none!important}
 .top{background:#fff;color:#000;padding:8px 8px 8px;border-bottom:2px solid #000}.top:before{display:none}.brand img{filter:invert(1) brightness(0);height:44px}
 .ticket{margin:8px 0;box-shadow:none;border:2px solid #000}.ticket .n div{color:#000}.due{background:#eee}.steps{display:none}.qrbox{border-color:#000}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">... جاري تحميل الفاتورة</div></div>
<script src="config.js?v=6"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const ST = { new: 'جديد', preparing: 'يتحضر', ready: 'جاهز للاستلام', on_the_way: 'بالطريق', done: 'تم التسليم', cancelled: 'ملغي' };
const t = new URLSearchParams(location.search).get('t');
const app = document.getElementById('app');
function steps(o) {
  const flow = o.order_type === 'delivery' ? ['new', 'preparing', 'ready', 'on_the_way', 'done'] : ['new', 'preparing', 'ready', 'done'];
  if (o.status === 'cancelled') return '';
  const k = flow.indexOf(o.status);
  return '<div class="steps noprint">' + flow.map((s, i) => `<div class="${i < k ? 'on' : i === k ? 'on cur' : ''}">${ST[s]}</div>`).join('') + '</div>';
}
function drawQR(id, text, sc) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), c = document.getElementById(id), m = 2; c.width = c.height = (n + m * 2) * sc;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#1d2166';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * sc, (r + m) * sc, sc, sc);
}
async function load(first) {
  if (!t || !/^[0-9a-f-]{36}$/i.test(t)) { app.innerHTML = '<div class="msg">رابط الفاتورة غير صحيح</div>'; return; }
  let o;
  try { o = await bunzApi.rpc('bunz_get_order', { t }); } catch (e) { if (first) app.innerHTML = '<div class="msg">صار خلل بالتحميل، حدّث الصفحة</div>'; return; }
  if (!o) { app.innerHTML = '<div class="msg">❌ هاي الفاتورة غير موجودة</div>'; return; }
  const d = new Date(o.created_at).toLocaleString('ar-IQ', { timeZone: 'Asia/Baghdad', hour: 'numeric', minute: '2-digit', day: 'numeric', month: 'numeric', year: 'numeric' });
  const wa = '964' + o.phone.slice(1);
  const del = o.order_type === 'delivery';
  const nav = o.lat ? `https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}&travelmode=driving` : '';
  const pieces = o.items.reduce((a, l) => a + l.qty, 0);
  document.title = 'طلب #' + o.order_no + ' · 10 BUNZ';
  app.innerHTML = `<div class="rc">
    <div class="top"><div class="brand"><img src="logo-white.png" alt="10 BUNZ"><div><b>فاتورة رسمية</b><small>${d}</small></div></div></div>
    <div class="ticket"><div class="n"><small>رقم الطلب</small><div>#${o.order_no}</div></div>
      <div class="t"><span class="pill st-${o.status}">${ST[o.status] || o.status}</span><div style="margin-top:6px;font-weight:800;font-size:13px">${del ? '🛵 توصيل' : '🏃 استلام من المطعم'}</div></div></div>
    ${steps(o)}
    ${!['done', 'cancelled'].includes(o.status) ? `<div class="qrbox"><canvas id="qr"></canvas><b>رمز استلام الطلب #${o.order_no}</b><small>${del ? 'للدلفري: ورّي هذا الكود للكاشير بالمطعم حتى يسلّمك الطلب' : 'ورّي هذا الكود للكاشير وقت الاستلام'}</small></div>` : ''}
    <div class="sec row"><div><div class="k">الزبون</div><div class="v">${esc(o.customer_name)}</div><div dir="ltr" style="text-align:right;font-weight:700">${esc(o.phone)}</div></div>
      ${o.driver_name ? `<div style="text-align:left"><div class="k">الدلفري</div><div class="v">🛵 ${esc(o.driver_name)}</div></div>` : ''}</div>
    <div class="sec"><div class="k">الطلب (${pieces} قطعة)</div><table>${o.items.map(l => `<tr><td><span class="qty">${l.qty}</span>${esc(l.name)}${l.options ? `<small>${esc(l.options)}</small>` : ''}${l.note ? `<small style="color:var(--deep);font-weight:800">📝 ${esc(l.note)}</small>` : ''}</td><td>${fmtIQD(l.line_total)}</td></tr>`).join('')}</table></div>
    <div class="sec">
      <div class="row"><span>المجموع</span><b>${fmtIQD(o.subtotal)}</b></div>
      ${del ? `<div class="row" style="margin-top:4px"><span>التوصيل (${(o.distance_m / 1000).toFixed(1)} كم)</span><b>${o.delivery_fee ? fmtIQD(o.delivery_fee) : 'مجاني'}</b></div>` : ''}
      <div class="due row"><span style="font-weight:900">${del ? 'تستلم من الزبون' : 'المبلغ المطلوب'}</span><span class="tot">${fmtIQD(o.total)}</span></div>
    </div>
    ${del ? `<div class="sec"><div class="k">العنوان</div>
      ${o.location_label ? `<div class="v">📍 ${esc(o.location_label)}</div>` : ''}${o.address_note ? `<div style="font-weight:700">🏠 ${esc(o.address_note)}</div>` : ''}
      <div class="btns noprint"><a class="btn" href="${nav}" target="_blank">🧭 ابدأ التوصيل</a><a class="btn s" href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank">📍 الخريطة</a></div></div>` : ''}
    ${o.notes ? `<div class="sec"><div class="k">ملاحظات</div><div class="v">📝 ${esc(o.notes)}</div></div>` : ''}
    <div class="sec noprint"><div class="btns"><a class="btn s" href="tel:${esc(o.phone)}">📞 اتصال بالزبون</a><a class="btn g" href="https://wa.me/${wa}" target="_blank">واتساب الزبون</a></div></div>
    <div class="verified">✓ فاتورة رسمية من نظام 10 BUNZ. المعتمد هو المبلغ بهذي الصفحة فقط.</div>
  </div>
  <button class="btn s noprint" style="width:100%;margin-top:12px" onclick="print()">🖨️ طباعة</button>`;
  if (document.getElementById('qr')) drawQR('qr', location.href, 8);
}
load(true);
setInterval(() => { if (!document.hidden) load(false); }, 20000);
</script>
</body>
</html>
